[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shrimpvision-mtl"
version = "1.0.0"
description = "Cross-dataset multi-task learning for shrimp disease recognition and non-invasive biomass estimation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code only; datasets are CC BY 4.0 - see LICENSE_NOTES.md)" }

# Versions below are the ones actually used for the reported runs. The exact
# resolved environment is pinned in requirements-lock.txt.
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0.15",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "Pillow>=10.2",
    "albumentations>=2.0",
    "ImageHash>=4.3",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "tensorboard>=2.16",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::UserWarning:sklearn.model_selection._split",
]

[tool.ruff]
line-length = 100
target-version = "py311"
